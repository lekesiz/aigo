name: 🐛 Bug Report
description: Report a bug or unexpected behavior in AIGo
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please verify the following before submitting
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported
          required: true
        - label: I am using the latest version of AIGo
          required: true
        - label: I have read the documentation
          required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Create a file with '...'
        2. Run command '...'
        3. Observe error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead, what happened was...
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal Code Sample
      description: Minimal AIGo code that reproduces the issue
      render: rust
      placeholder: |
        module main

        fn main() -> Result<void, Error> {
            // Your code here
            return Ok(void)
        }
    validations:
      required: false

  - type: textarea
    id: error
    attributes:
      label: Error Message
      description: Full error message or traceback if applicable
      render: shell
      placeholder: Paste the complete error message here
    validations:
      required: false

  - type: input
    id: aigo-version
    attributes:
      label: AIGo Version
      description: Output of `aigo --version`
      placeholder: "1.0.0-beta"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version`
      placeholder: "Python 3.11.5"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Your OS and version
      placeholder: "Ubuntu 22.04 / macOS 13.0 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information about the problem
      placeholder: Add any other context about the problem here
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Possible Workaround
      description: If you've found a workaround, please share it
      placeholder: I found that I can work around this by...
    validations:
      required: false
