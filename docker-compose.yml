version: '3.8'

services:
  # Main AIGo interpreter service
  aigo:
    build:
      context: .
      dockerfile: Dockerfile
    image: aigo-lang:latest
    container_name: aigo-interpreter
    volumes:
      - ./workspace:/workspace
      - ./examples:/app/examples:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: aigo --help

  # Development environment with all tools
  aigo-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: aigo-lang:dev
    container_name: aigo-dev
    volumes:
      - .:/app
      - ./workspace:/workspace
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      - PYTHONPATH=/app/src
      - AIGO_DEBUG=1
    command: /bin/bash

  # REPL interactive shell
  aigo-repl:
    image: aigo-lang:latest
    container_name: aigo-repl
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: aigo-repl

  # Run tests
  aigo-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: aigo-lang:latest
    container_name: aigo-test
    volumes:
      - .:/app
    working_dir: /app
    command: pytest tests/ -v --cov=src/aigo

  # Performance benchmarks
  aigo-bench:
    image: aigo-lang:latest
    container_name: aigo-bench
    volumes:
      - .:/app
      - ./benchmarks:/workspace
    working_dir: /workspace
    command: python /app/benchmarks/run_benchmarks.py

# Volumes for persistent data
volumes:
  workspace:
    driver: local

# Networks
networks:
  default:
    name: aigo-network
